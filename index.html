<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sim Motorsports | Coming Soon</title>
<style>
  :root {
    --navy: #0b1220;
    --blue: #1b4a8a;
    --red: #8f2430;
    --bg-light: #f6f7f9;
    --bg-dark: #0b1220;
    --text-light: #0b1220;
    --text-dark: #f0f1f3;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: var(--bg-dark);
      --text: var(--text-dark);
      --card: #131b2c;
    }
  }
  :root, :root[data-theme="light"] {
    --bg: var(--bg-light);
    --text: var(--text-light);
    --card: #ffffff;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Helvetica Neue', Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100%;
    padding: 32px 20px;
  }
  .card {
    background: var(--card);
    border-radius: 20px;
    padding: 48px 40px 40px;
    max-width: 480px;
    width: 100%;
    text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,0.12);
  }
  .logo {
    max-width: 260px;
    width: 100%;
    height: auto;
    margin-bottom: 8px;
  }
  .location {
    font-size: 15px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--blue);
    font-weight: 700;
    margin: 20px 0 4px;
  }
  .coming-soon {
    font-size: 30px;
    font-weight: 800;
    letter-spacing: 0.02em;
    color: var(--navy);
    margin: 6px 0 22px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .coming-soon { color: var(--text-dark); }
  }
  .divider {
    width: 60px;
    height: 3px;
    background: var(--red);
    margin: 0 auto 22px;
    border-radius: 2px;
  }
  .contact-label {
    font-size: 13px;
    color: #6b7280;
    margin-bottom: 6px;
  }
  a.email {
    display: inline-block;
    font-size: 17px;
    font-weight: 600;
    color: var(--red);
    text-decoration: none;
    border-bottom: 2px solid var(--red);
    padding-bottom: 2px;
  }
  a.email:hover { opacity: 0.8; }
</style>
</head>
